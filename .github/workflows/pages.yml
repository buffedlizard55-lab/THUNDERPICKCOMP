name: Collect verified sources and deploy Pages

on:
  push:
    branches: ["main"]
  schedule:
    # GitHub Actions cron is best effort; browser displays staleness if delayed.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: read # download the previous successful, short-lived journal checkpoint
  contents: write # append the versioned journal-archive branch (long-term durability)
  pages: write
  id-token: write

concurrency:
  group: "pages-journal"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch last successful Actions journal checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')
          if [[ -n "$last" ]]; then
            mkdir -p /tmp/previous-thunderpickcomp/artifact
            gh run download "$last" --repo "$GITHUB_REPOSITORY" --name "journal-$last" \
              --dir /tmp/previous-thunderpickcomp/artifact
            echo "Downloaded the last successful journal checkpoint from Actions run $last."
          fi
      - name: Fetch versioned journal-archive snapshot + provenance history (durable; outlives artifacts)
        run: |
          set -euo pipefail
          if git fetch --quiet --depth=400 origin journal-archive 2>/dev/null; then
            mkdir -p /tmp/previous-thunderpickcomp/archive /tmp/previous-thunderpickcomp/archive-history
            for f in observations.json ledger.json settlements.json; do
              git show "FETCH_HEAD:$f" > "/tmp/previous-thunderpickcomp/archive/$f" 2>/dev/null \
                || rm -f "/tmp/previous-thunderpickcomp/archive/$f"
            done
            n=0
            for sha in $(git rev-list FETCH_HEAD); do
              git show "$sha:observations.json" > "/tmp/previous-thunderpickcomp/archive-history/$sha.json" 2>/dev/null \
                && n=$((n+1)) || rm -f "/tmp/previous-thunderpickcomp/archive-history/$sha.json"
            done
            echo "journal-archive head $(git rev-parse FETCH_HEAD); $n observation snapshots kept as provenance evidence."
          else
            echo "journal-archive branch not available yet."
          fi
      - name: Restore newest compatible Pages/Actions quote + paper-decision journal
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/THUNDERPICKCOMP
        run: |
          set -euo pipefail
          mkdir -p /tmp/previous-thunderpickcomp
          artifact_args=()
          if [[ -d /tmp/previous-thunderpickcomp/artifact ]]; then
            artifact_args=(--artifact-dir /tmp/previous-thunderpickcomp/artifact)
          fi
          if [[ -f /tmp/previous-thunderpickcomp/archive/observations.json && -f /tmp/previous-thunderpickcomp/archive/ledger.json ]]; then
            artifact_args+=(--archive-dir /tmp/previous-thunderpickcomp/archive)
          fi
          if [[ -d /tmp/previous-thunderpickcomp/archive-history ]]; then
            artifact_args+=(--provenance-history /tmp/previous-thunderpickcomp/archive-history)
          fi
          observations_url="$PAGES_BASE/data/observations.json?run=$GITHUB_RUN_ID"
          status=$(curl --silent --show-error --location --max-time 35 --retry 2 \
            --output /tmp/previous-thunderpickcomp/observations.json \
            --write-out '%{http_code}' "$observations_url")
          if [[ "$status" == "404" && "$EVENT" == "push" && "$BEFORE" == "345872fa2a636ad029b400f96891525de60c8afd" ]]; then
            echo "One-time initial deployment: older site had no observations journal. Using tracked offline research seed."
          elif [[ "$status" == "200" ]]; then
            ledger_status=$(curl --silent --show-error --location --max-time 35 --retry 2 \
              --output /tmp/previous-thunderpickcomp/ledger.json \
              --write-out '%{http_code}' "$PAGES_BASE/data/ledger.json?run=$GITHUB_RUN_ID")
            if [[ "$ledger_status" != "200" ]]; then
              echo "Published ledger unavailable ($ledger_status). Refusing to reset history." >&2
              exit 1
            fi
            settlements_args=()
            settlements_status=$(curl --silent --show-error --location --max-time 35 --retry 2 \
              --output /tmp/previous-thunderpickcomp/settlements.json \
              --write-out '%{http_code}' "$PAGES_BASE/data/settlements.json?run=$GITHUB_RUN_ID")
            if [[ "$settlements_status" == "200" ]]; then
              settlements_args=(--settlements /tmp/previous-thunderpickcomp/settlements.json)
            else
              echo "Published settlement journal unavailable ($settlements_status); starting from the committed/empty chain."
            fi
            set +e
            python3 -m scripts.restore \
              --observations /tmp/previous-thunderpickcomp/observations.json \
              --ledger /tmp/previous-thunderpickcomp/ledger.json \
              "${settlements_args[@]}" \
              "${artifact_args[@]}" --require-live-history
            restore_exit=$?
            set -e
            if [[ $restore_exit -ne 0 ]]; then
              # restore.py wrote /tmp/restore-debug/restore_failure.json and left data/ untouched.
              mkdir -p /tmp/restore-debug
              cp -R /tmp/previous-thunderpickcomp /tmp/restore-debug/ 2>/dev/null || true
              echo "Restore refused: candidate journals disagree or none covers the others. History protected; see restore-debug artifact." >&2
              exit $restore_exit
            fi
          elif [[ "$status" == "404" && ${#artifact_args[@]} -gt 0 ]]; then
            echo "Published journal missing; restoring the last successful Actions checkpoint / journal-archive."
            python3 -m scripts.restore "${artifact_args[@]}" --require-live-history
          else
            echo "Published observations unavailable ($status). Refusing to reset history." >&2
            exit 1
          fi
      - name: Upload restore debug on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: restore-debug-${{ github.run_id }}
          path: /tmp/restore-debug
          retention-days: 7
      - name: Collect read-only free public APIs (record failures, never fake zero)
        run: python3 -m scripts.collect
      - name: Apply eligible forward-only simulated outright decisions
        run: python3 -m scripts.competition
      - name: Record settlement receipts and apply confirmed settlements (never assumes void)
        run: python3 -m scripts.settle
      - name: Generate historical backtesting leaderboard (verified matches + modeled odds where no free line)
        run: python3 -m scripts.backtest
      - name: Rebuild the real-line strategy lab (leaderboard, analytics, featured ledgers, match table)
        run: python3 -m scripts.strategy_lab
      - name: Validate data and regression tests before publishing
        run: |
          python3 scripts/validate.py
          python3 -m unittest discover -s tests -v
          node --check assets/app.js
          node tests/test_ui.cjs
      - name: Archive the live journal (refuses anything but mode=live)
        run: |
          set -euo pipefail
          python3 -m scripts.archive --out /tmp/journal-archive --run-id "$GITHUB_RUN_ID" \
            --commit-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --expect-mode live
          # data/ here holds the exact validated journal this run is about to
          # publish; a deploy-job checkout would have archived the committed
          # offline seed instead (bug of run 36050952696's first archive commit).
          git config user.name "thunderpickcomp-journal-bot"
          git config user.email "actions@users.noreply.github.com"
          # Commit from a SEPARATE worktree. The old in-place `git checkout --force` to the archive
          # branch and back reverted every tracked file this run produced (observations, ledger,
          # settlements, derived JSON) to the committed offline seed BEFORE the recovery artifact and
          # the site package were built -- the root cause of the 2026-09-24 history reset.
          rm -rf /tmp/archive-wt
          if git fetch --quiet origin journal-archive 2>/dev/null; then
            git worktree add --quiet --detach /tmp/archive-wt FETCH_HEAD
          else
            git worktree add --quiet --detach /tmp/archive-wt HEAD
            git -C /tmp/archive-wt checkout --quiet --orphan journal-archive
            git -C /tmp/archive-wt rm -rf --quiet . 2>/dev/null || true
          fi
          cp /tmp/journal-archive/MANIFEST.json /tmp/journal-archive/observations.json \
             /tmp/journal-archive/ledger.json /tmp/journal-archive/settlements.json /tmp/archive-wt/
          git -C /tmp/archive-wt add MANIFEST.json observations.json ledger.json settlements.json
          if git -C /tmp/archive-wt diff --cached --quiet; then
            echo "Archive unchanged; nothing to commit."
          else
            git -C /tmp/archive-wt commit --quiet -m "Journal archive: run $GITHUB_RUN_ID [skip ci]"
            git -C /tmp/archive-wt push --quiet origin HEAD:journal-archive
          fi
          git worktree remove --force /tmp/archive-wt
          mkdir -p data
          cp /tmp/journal-archive/MANIFEST.json data/archive_manifest.json
      - name: Refuse to package anything but the journal this run validated
        run: |
          python3 - <<'PY'
          import json, sys
          obs = json.load(open("data/observations.json"))
          man = json.load(open("data/archive_manifest.json"))
          if obs.get("mode") != "live":
              sys.exit(f"about to publish mode={obs.get('mode')!r}; the live journal was lost from the working tree")
          print("Publishing live journal", obs.get("last_attempt_utc"), "archive manifest", man.get("run_id", ""))
          PY
      - name: Save short-lived recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: journal-${{ github.run_id }}
          path: |
            data/observations.json
            data/ledger.json
            data/settlements.json
          retention-days: 30
      - name: Package only public site files
        run: |
          mkdir -p _site
          cp .nojekyll *.html _site/
          cp -R assets data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
